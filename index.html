<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAM Hikes · 2150 South · PCT Southbound Journal</title>
  <meta name="description" content="A visual, map-first journal of Daniel Armando Martinez's 2,150-mile southbound hike on the Pacific Crest Trail from Cascade Locks to Campo." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Fullscreen Map Viewport -->
  <div class="relative h-screen w-full overflow-hidden" style="position: relative; width: 100vw; height: 100dvh;">
    
    <!-- Leaflet Map Container -->
    <div id="trail-map" class="leaflet-container" role="application" aria-label="Pacific Crest Trail Southbound Map"></div>

    <!-- Map Top Vignette Gradient Overlay -->
    <div class="map-top-vignette"></div>

    <!-- Floating Top Header Overlay -->
    <header class="floating-header-wrapper">
      <div class="floating-header">
        <div class="brand-meta-group">
          <div class="brand-title-row">
            <h1 class="brand-title">DAM Hikes</h1>
            <span class="brand-sub-badge">PCT SOBO</span>
          </div>
          <p class="trail-status-line" id="header-status-line">
            <span id="header-location">Cascade Locks, OR</span>
            <span class="trail-status-sub"> · mi <span id="header-mile">2150.0</span> · <span id="header-day">Day 1</span></span>
          </p>
          <p class="trail-mileage-counts" id="header-counts-line">
            <span id="header-walked">0.0</span> mi walked · <span id="header-remaining">2150.0</span> to Campo
          </p>
        </div>

        <div class="header-actions-group">
          <button type="button" id="btn-open-about" class="btn-header-glass" aria-label="About the hike and gear list" title="Hiker Bio & Gear List">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <button type="button" id="btn-open-compose" class="btn-header-primary" aria-label="New update" title="New Journal Entry">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Floating Map Control Buttons (Right) -->
    <div class="floating-map-controls">
      <button type="button" class="trail-map-btn" id="btn-frame-here" title="Focus current trail position" aria-label="Zoom to current position">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
      </button>
      <button type="button" class="trail-map-btn" id="btn-frame-trail" title="Fit whole 2,150-mile trail" aria-label="Show the whole trail">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a4.5 4.5 0 0 0 0-9H8.5a4.5 4.5 0 0 1 0-9H18"/><circle cx="18" cy="5" r="3"/></svg>
      </button>
      <button type="button" class="trail-map-btn" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button type="button" class="trail-map-btn" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Bottom Dock: Elevation Profile + Active Trail Card -->
    <div id="bottom-dock-container" class="bottom-dock-container">
      
      <!-- Interactive SVG Elevation Profile Component -->
      <div class="elevation-profile-bar" id="elevation-profile-container"></div>

      <!-- Active Moment Trail Card Component -->
      <div id="moment-detail-container"></div>

    </div>

  </div>

  <!-- Slide-Up App Sheet: About & Gear -->
  <div id="sheet-about" class="app-sheet-modal" role="dialog" aria-modal="true" aria-label="The hike and gear list">
    <div class="app-sheet-backdrop" id="sheet-about-backdrop"></div>
    <div class="app-sheet-dialog tall">
      <header class="app-sheet-header">
        <h2 class="app-sheet-title">The Hike & Gear</h2>
        <button type="button" class="app-sheet-close-btn" id="sheet-about-close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div class="app-sheet-body" id="sheet-about-content"></div>
    </div>
  </div>

  <!-- Slide-Up App Sheet: Compose Update -->
  <div id="sheet-compose" class="app-sheet-modal" role="dialog" aria-modal="true" aria-label="New trail update">
    <div class="app-sheet-backdrop" id="sheet-compose-backdrop"></div>
    <div class="app-sheet-dialog">
      <header class="app-sheet-header">
        <h2 class="app-sheet-title">New Trail Update</h2>
        <button type="button" class="app-sheet-close-btn" id="sheet-compose-close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div class="app-sheet-body" id="sheet-compose-content"></div>
    </div>
  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div id="photo-lightbox" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <button type="button" class="lightbox-close-btn" id="lightbox-close-btn" aria-label="Close photo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img id="lightbox-img" class="lightbox-img-element" src="" alt="Trail photograph" />
  </div>

  <!-- Leaflet JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Main JavaScript Module -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
