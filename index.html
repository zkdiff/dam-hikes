<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAM Hikes · Pacific Crest Trail Southbound Journal</title>
  <meta name="description" content="A visual, map-first journal of Daniel Armando Martinez's 2,150-mile southbound hike on the Pacific Crest Trail from Cascade Locks to Campo." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Application CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Top Global Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-badge">PCT SOBO</div>
      <div class="brand-titles">
        <h1 class="brand-name">DAM Hikes</h1>
        <span class="brand-tagline">Cascade Locks → Campo · 2,150 Miles</span>
      </div>
    </div>

    <!-- Discrete Screen Switcher Nav -->
    <nav class="header-nav" aria-label="Main Navigation">
      <button class="nav-tab active" id="nav-btn-explorer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
        <span>Trail Explorer</span>
      </button>
      <button class="nav-tab" id="nav-btn-author">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Add Entry</span>
      </button>
      <button class="nav-tab" id="nav-btn-overview">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Overview & Bio</span>
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="btn-icon-header" id="btn-fit-full-trail" title="Fit full 2,150-mile trail in map view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        <span>Full Trail</span>
      </button>
      <button class="btn-icon-header" id="btn-theme-toggle" title="Toggle Theme" aria-label="Toggle Light/Dark Theme">
        <!-- Injected via JS -->
      </button>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="app-main">

    <!-- Screen 1: Explorer View (Map + Detail Panel + Elevation Profile) -->
    <section class="screen-view active" id="screen-explorer">
      <div class="explorer-layout">
        
        <!-- Left / Center Column: Map & Elevation Scrubber -->
        <div class="explorer-map-column">
          <div class="map-wrapper">
            <div id="trail-map" class="trail-map-container" aria-label="Interactive PCT Trail Map"></div>
            
            <!-- Map Overlay Quick Legend -->
            <div class="map-legend-overlay">
              <span class="legend-chip"><span class="chip-dot dot-completed"></span> Completed Route</span>
              <span class="legend-chip"><span class="chip-dot dot-remaining"></span> Remaining Trail</span>
            </div>
          </div>

          <!-- Bottom Elevation Scrubber -->
          <div id="elevation-profile-container" class="elevation-container"></div>
        </div>

        <!-- Right Column: Moment Detail Panel & Chronological Timeline -->
        <div class="explorer-sidebar-column">
          <!-- Active Moment Detail Area -->
          <div id="moment-detail-container" class="moment-detail-wrapper"></div>

          <!-- Chronological Moments Timeline & Filter Index -->
          <div id="timeline-list-container" class="timeline-list-wrapper"></div>
        </div>

      </div>
    </section>

    <!-- Screen 2: Author Composer Screen (Discrete Full-Page Workspace) -->
    <section class="screen-view" id="screen-author" style="display: none;"></section>

    <!-- Screen 3: Overview & Bio Screen (Discrete Full-Page Workspace) -->
    <section class="screen-view" id="screen-overview" style="display: none;"></section>

  </main>

  <!-- Fullscreen Photo Lightbox Modal -->
  <div id="photo-lightbox" class="lightbox-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button id="lightbox-close" class="lightbox-close-btn" aria-label="Close Lightbox">×</button>
      <div class="lightbox-img-wrapper">
        <img id="lightbox-img" src="" alt="Trail photography" />
      </div>
      <div id="lightbox-caption" class="lightbox-caption-text"></div>
    </div>
  </div>

  <!-- Leaflet JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Entrypoint -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
